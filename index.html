<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>MY DAILY</title>
  <style>
    :root {
      --ink: #29283a;
      --muted: #858397;
      --line: #efedf3;
      --blue: #eaf0ff;
      --green: #e5f4ea;
      --purple: #f4eaf7;
      --shadow: 0 8px 24px rgba(42, 35, 65, .045);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    .wrap { width: min(100% - 32px, 760px); margin: 0 auto; padding: 42px 0 28px; }
    header { text-align: center; padding: 12px 0 30px; }
    .date { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
    h1 { margin: 12px 0 8px; font-size: clamp(34px, 8vw, 48px); letter-spacing: -.06em; font-weight: 800; }
    .welcome { margin: 0; color: #77748b; font-size: 14px; line-height: 1.8; }
    .eyebrow { margin: 34px 2px 14px; font-size: 11px; letter-spacing: .16em; color: #9995aa; font-weight: 800; }
    .apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .app {
      display: flex; flex-direction: column; min-height: 178px; padding: 20px;
      text-decoration: none; color: inherit; border: 1px solid var(--line);
      border-radius: 24px; box-shadow: var(--shadow); transition: transform .18s ease, box-shadow .18s ease;
    }
    .app:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(42,35,65,.09); }
    .app:focus-visible { outline: 3px solid #a99be8; outline-offset: 3px; }
    .workout { background: var(--blue); }
    .money { background: var(--green); }
    .calendar { background: var(--purple); }
    .soon { background: #fff; border: 1px dashed #dedbe6; box-shadow: none; }
    .icon {
      display: grid; place-items: center; width: 48px; height: 48px;
      border-radius: 17px; background: rgba(255,255,255,.82);
    }
    .icon svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .workout .icon, .workout .arrow { color: #315daa; }
    .money .icon, .money .arrow { color: #287447; }
    .calendar .icon, .calendar .arrow { color: #80518e; }
    .soon .icon, .soon .arrow { color: #77748b; }
    .app-name { margin-top: 18px; font-size: 17px; font-weight: 750; letter-spacing: -.02em; }
    .desc { margin-top: 5px; color: #77758a; font-size: 12px; line-height: 1.5; }
    .open { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 18px; color: #77718e; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .arrow { font-size: 20px; }
    footer { margin-top: 30px; text-align: center; color: #aaa6b7; font-size: 10px; letter-spacing: .14em; }
    .name-setting { margin-top: 14px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); font: inherit; font-size: 11px; letter-spacing: .04em; cursor: pointer; }
    .name-setting:hover { border-color: #cfc8e8; color: var(--ink); }
    @media (max-width: 420px) {
      .wrap { padding-top: 30px; } .apps { gap: 10px; }
      .app { min-height: 166px; padding: 16px; border-radius: 20px; }
      .app-name { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="date" id="today">TODAY</div>
      <h1 id="brandTitle">MY DAILY<span style="color:#b9a9ee">.</span></h1>
      <p class="welcome">안녕하세요! 오늘도 나의 하루를 차근차근 기록해 봐요.<br>작은 기록이 모여 나만의 일상이 됩니다.</p>
    </header>
    <div class="eyebrow">MY TOOLS</div>
    <section class="apps" aria-label="나의 앱">
      <a class="app workout" href="https://kr-tools.github.io/ma-workout/">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 7.5v9M4 9v6M17.5 7.5v9M20 9v6M6.5 12h11M2.5 10v4M21.5 10v4"/></svg></span>
        <span class="app-name">Workout</span><span class="desc">운동 기록</span>
        <span class="open">OPEN APP <span class="arrow">↗</span></span>
      </a>
      <a class="app money" href="#" data-coming="true">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 9h18M16 14h2M7 6V4.5A1.5 1.5 0 0 1 8.5 3H19"/></svg></span>
        <span class="app-name">Money</span><span class="desc">소비 관리</span>
        <span class="open">COMING SOON <span class="arrow">＋</span></span>
      </a>
      <a class="app calendar" href="#" data-coming="true">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M7 3v4M17 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg></span>
        <span class="app-name">Calendar</span><span class="desc">일정 관리</span>
        <span class="open">COMING SOON <span class="arrow">＋</span></span>
      </a>
      <div class="app soon">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg></span>
        <span class="app-name">Coming Soon</span><span class="desc">새로운 앱을 준비하고 있어요</span>
        <span class="open">STAY TUNED <span class="arrow">✧</span></span>
      </div>
    </section>
    <footer><button class="name-setting" id="nameSetting" type="button">이름 설정</button></footer>
  </main>
  <script>
    const now = new Date();
    const weekdays = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
    document.getElementById("today").textContent =
      `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 · ${weekdays[now.getDay()]}`;
    const brandTitle = document.getElementById("brandTitle");
    const nameSetting = document.getElementById("nameSetting");

    function updateBrandTitle() {
      const savedName = localStorage.getItem("myDailyName") || "";
      const label = savedName.trim() ? `${savedName.trim()}'s DAILY` : "MY DAILY";
      brandTitle.innerHTML = "";
      brandTitle.append(document.createTextNode(label));
      const dot = document.createElement("span");
      dot.style.color = "#b9a9ee";
      dot.textContent = ".";
      brandTitle.append(dot);
    }

    nameSetting.addEventListener("click", () => {
      const currentName = localStorage.getItem("myDailyName") || "";
      const enteredName = window.prompt("표시할 이름을 입력해 주세요.\n비워두면 MY DAILY로 돌아갑니다.", currentName);
      if (enteredName === null) return;
      const cleanName = enteredName.trim();
      if (cleanName) localStorage.setItem("myDailyName", cleanName);
      else localStorage.removeItem("myDailyName");
      updateBrandTitle();
    });

    updateBrandTitle();

    document.querySelectorAll('[data-coming="true"]').forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        alert("앱 주소를 연결하면 사용할 수 있어요!");
      });
    });
  </script>
</body>
</html>
